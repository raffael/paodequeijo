  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  .hint { color: var(--text-secondary); font-size: 12px; margin: 0 0 12px; }

  }
</style>

function cleanTrip(data) {
  const isDay = s => typeof s === 'string' && /^\d{4}-\d\d-\d\d$/.test(s);
  const isTime = s => typeof s === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(s);
  if (!data || !isDay(data.startDate) || !isDay(data.endDate) || !Array.isArray(data.items)) throw new Error('not a trip');
  const span = toMs(data.endDate) - toMs(data.startDate);
  if (span < 0 || span > 730 * DAY) throw new Error('bad dates');
  const items = data.items.filter(it => it && ITEM_TYPES[it.type] && isTime(it.at)).map(it => {
    const out = { id: String(it.id || uid()), type: it.type, at: it.at };
    if (isTime(it.until)) out.until = it.until;
    for (const k of ['mode', 'kind', 'from', 'to', 'title', 'location', 'address', 'details', 'url', 'notes', 'fromTz', 'toTz']) {
      if (typeof it[k] === 'string') out[k] = it[k];
    }
    for (const k of ['fromTz', 'toTz']) if (out[k] && !isZone(out[k])) delete out[k];
    if (it.type === 'travel' && !MODES[out.mode]) out.mode = 'car';
    out.status = statusOf(it);
    return out;
  });
  return { title: String(data.title || 'My trip'), startDate: data.startDate, endDate: data.endDate, items };
}

const GIST_FILE = 'trip.json';

async function github(method, path, token, body) {
  let res;
  try {
    res = await fetch('https://api.github.com' + path, {
      method,
      cache: 'no-store',
      headers: {
        Accept: 'application/vnd.github+json',
        ...(token && { Authorization: 'Bearer ' + token }),
        ...(body && { 'Content-Type': 'application/json' }),
      },
      body: body && JSON.stringify(body),
    });
  } catch { throw new Error("Can't reach GitHub. Check your connection and try again."); }
  if (res.ok) return res.json();
  if (res.status === 401) throw new Error('GitHub rejected this token. Create a new one with the gist permission.');
  if (res.status === 403 || res.status === 429) throw new Error('GitHub is limiting requests from this network, or the token lacks the gist permission. Try again in an hour.');
  if (res.status === 404) throw new Error(token
    ? "GitHub can't find this trip for your account. Only the person who first saved it can change it."
    : "This trip isn't on GitHub any more. Ask for a new link.");
  throw new Error(`GitHub returned an error (${res.status}). Try again.`);
}

async function saveToGitHub(rec, token) {
  rec.key = rec.key || newKey();
  const snapshot = JSON.stringify(rec.trip);
  const files = { [GIST_FILE]: { content: await encryptTrip(rec.trip, rec.key) } };
  let gist;
  if (rec.gistId) {
    const current = await github('GET', `/gists/${rec.gistId}`, token);
    if (rec.gistUpdatedAt && current.updated_at !== rec.gistUpdatedAt &&
        !confirm('This trip was changed on GitHub since you last opened it, possibly from another device. Replace that version with yours?')) {
      return false;
    }
    gist = await github('PATCH', `/gists/${rec.gistId}`, token, { files });
  } else {
    gist = await github('POST', '/gists', token, { description: '', public: false, files });
  }
  rec.gistId = gist.id;
  rec.gistUpdatedAt = gist.updated_at;
  rec.dirty = JSON.stringify(rec.trip) !== snapshot; // edits made while saving still need saving
  saveRecord(rec);
  return true;
}

async function loadFromGitHub(gistId, key) {
  const gist = await github('GET', `/gists/${gistId}`);
  const file = gist.files[GIST_FILE];
  if (!file) throw new Error("This link doesn't point to a trip.");
  let text = file.content;
  if (file.truncated) text = await (await fetch(file.raw_url)).text();
  try {
    return { trip: await decryptTrip(text, key), updatedAt: gist.updated_at };
  } catch { throw new Error("This link's key doesn't open the trip. Ask for the full link, including everything after the #."); }

/* ---------- Where am I? Works out the line's segments from start, travel and end items ---------- */

const tripStart = trip => toMs(trip.startDate);
const tripEnd = trip => toMs(trip.endDate) + DAY;

function computeSegments(trip) {
  const T0 = tripStart(trip), T1 = tripEnd(trip);
  const start = trip.items.find(i => i.type === 'start');
  const end = trip.items.find(i => i.type === 'end');
  const travels = trip.items.filter(i => i.type === 'travel').sort((a, b) => toMs(a.at) - toMs(b.at));
  let segs = [], pos = T0, current = null;
  const mismatches = {};
  const stayUntil = (b) => { if (b > pos) segs.push(current ? { kind: 'place', name: current, a: pos, b } : { kind: 'empty', a: pos, b }); };

  if (start) {
    pos = clamp(toMs(start.at), T0, T1);
    if (pos > T0) segs.push({ kind: 'empty', outside: true, a: T0, b: pos });
    current = start.location;
  } else if (travels.length) {
    current = travels[0].from;
  }
  for (const tr of travels) {
    const a = Math.max(toMs(tr.at), pos);
    // Flying west can land "before" take-off in local time, so the line uses the later of the two.
    const b = Math.min(Math.max(toMs(tr.until || tr.at), a), T1);
    if (current && placeKey(current) !== placeKey(tr.from)) mismatches[tr.id] = current;
    stayUntil(a);
    segs.push({ kind: 'transit', item: tr, from: tr.from, to: tr.to, a, b });
    current = tr.to;
    pos = b;
  }
  stayUntil(T1);
  if (end) {
    const e = clamp(toMs(end.at), T0, T1);
    segs = segs.filter(s => s.a < e).map(s => ({ ...s, b: Math.min(s.b, e) }));
    if (e < T1) segs.push({ kind: 'empty', outside: true, a: e, b: T1 });
  }
  return { segs, mismatches };
}

function placeAt(segs, t) {
  const seg = segs.find(s => s.a <= t && t < s.b);
  if (!seg || seg.kind === 'empty') return { name: '', outside: seg?.outside };
  return seg.kind === 'transit' ? { name: seg.to, transit: true } : { name: seg.name };
}

}

  document.title = 'paodequeijo';
  rec = null;
  const error = h('p.error', { hidden: true });
  const title = h('input', { required: true, placeholder: 'Summer in Portugal' });
  const first = h('input', { type: 'date', required: true });
  const last = h('input', { type: 'date', required: true });
  const origin = h('input', { required: true, placeholder: 'Home, Berlin, wherever you set off' });
  const form = h('form.panel', {
    onsubmit(e) {
      e.preventDefault();
      if (last.value < first.value) { error.textContent = 'The last day has to be on or after the first day.'; error.hidden = false; return; }
      const start = { id: uid(), type: 'start', status: 'planned', at: first.value + 'T00:00', location: origin.value.trim() };
      createTrip({ title: title.value.trim(), startDate: first.value, endDate: last.value, items: [start] });
    },
  },
    h('label.field', {}, 'Trip name', title),
    h('.row', {}, h('label.field', {}, 'First day', first), h('label.field', {}, 'Last day', last)),
    h('label.field', {}, 'Where do you start from?', origin),
    error,
    h('button.primary', { type: 'submit' }, 'Create trip'));

  const records = Object.values(loadRecords()).sort((a, b) => b.savedAt - a.savedAt);
  app.replaceChildren(h('.home', {}, h('.home-inner', {},
    h('h1', {}, '🧳 Where to next?'),
    form,
    h('p', {}, h('button.plain', { type: 'button', onclick: pickTripFile }, 'Open a trip file')),
    records.length > 0 && h('h2', {}, 'Your trips'),
    records.map(r => h('.saved-trip', {},
      h('button.open', { type: 'button', onclick() { navigate('?edit=' + r.id); } },
        r.trip.title, h('small', {}, `${fmtDay(toMs(r.trip.startDate))} to ${fmtDay(toMs(r.trip.endDate))}`)),
      h('button.danger', {
        type: 'button', 'aria-label': `Delete ${r.trip.title}`,
        onclick() {
          const note = r.gistId ? ' Its shared link keeps working.' : '';
          if (confirm(`Delete "${r.trip.title}" from this browser?${note}`)) { deleteRecord(r.id); showHome(); }
        },
      }, 'Delete'))),
  )));
}

async function openShared(gistId, key) {
  app.replaceChildren(h('.home', {}, h('p', {}, 'Opening trip…')));
  const fail = message => app.replaceChildren(h('.home', {}, h('.home-inner', {},
    h('h1', {}, "This trip can't be opened"), h('p', {}, message),
    h('button', { type: 'button', onclick() { navigate(''); } }, 'Go to my trips'))));
  if (!/^[0-9a-f]{20,40}$/i.test(gistId)) return fail("This link isn't complete. Ask for the full link.");
  if (!key) return fail('This link is missing the part after the #, which unlocks the trip. Ask for the full link.');
  if (!crypto.subtle) return fail('This browser can only open trips over https.');
  try {
    const { trip, updatedAt } = await loadFromGitHub(gistId, key);
    showTrip({ id: null, trip, gistId, key, gistUpdatedAt: updatedAt, dirty: false }, true);
  } catch (err) { fail(err.message); }
}

function editSharedTrip(viewed) {
  const existing = Object.values(loadRecords()).find(r => r.gistId === viewed.gistId);
  if (existing?.dirty) {
    navigate('?edit=' + existing.id);
    toast('Opened your unsaved version of this trip.');
    return;
  }
  const record = { ...viewed, id: existing?.id || uid() };
  saveRecord(record);
  navigate('?edit=' + record.id);
}

function showTrip(record, viewOnly) {
  rec = record;
  readOnly = viewOnly;
  document.title = `${rec.trip.title} | paodequeijo`;
  zoomInput = h('input', {
    type: 'range', min: 0, max: 100, value: zoomToSlider(pxPerDay), 'aria-label': 'Timeline scale',
    oninput() { setZoom(sliderToZoom(+zoomInput.value)); },
  });
  statusEl = h('span.status');
  saveArea = h('.save-actions');
  scroller = h('.scroller', { tabIndex: 0, 'aria-label': 'Trip timeline' });
  scroller.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return; // trackpad pinch arrives as ctrl+wheel
    e.preventDefault();
    setZoom(pxPerDay * Math.exp(-e.deltaY * 0.01), e.clientY);
  }, { passive: false });

  app.replaceChildren(...[
    h('.toolbar', {},
      h('button.plain', { type: 'button', 'aria-label': 'Back to my trips', onclick() { navigate(''); } }, '🧳'),
      readOnly
        ? h('strong.title', { style: { flex: '1 1 160px' } }, rec.trip.title)
        : h('input.title', {
            value: rec.trip.title, 'aria-label': 'Trip name',
            onchange(e) { rec.trip.title = e.target.value.trim() || 'My trip'; e.target.value = rec.trip.title; commit(); },
          }),
      !readOnly && h('button', { type: 'button', onclick: openDatesDialog }, 'Change dates'),
      statusEl,
      h('.zoom', {},
        h('button', { type: 'button', 'aria-label': 'Zoom out', onclick() { setZoom(pxPerDay / 1.4); } }, '−'),
        zoomInput,
        h('button', { type: 'button', 'aria-label': 'Zoom in', onclick() { setZoom(pxPerDay * 1.4); } }, '+')),
      !readOnly && h('button', {
        type: 'button',
        onclick(e) {
          const r = e.currentTarget.getBoundingClientRect();
          const mid = (scroller.scrollTop + scroller.clientHeight / 2 - PAD) / pxPerDay;
          const day = clamp(Math.floor(mid), 0, dayCount() - 1);
          openAddMenu(tripStart(rec.trip) + day * DAY + 12 * HOUR, r.left, r.bottom + 6);
        },
      }, 'Add'),
      !readOnly && saveArea),
    readOnly && h('.notice', {}, 'You’re viewing this trip. Click anything to see its details.',
      h('button', { type: 'button', onclick() { editSharedTrip(rec); } }, 'Edit this trip')),
    scroller,
  ].filter(Boolean));
  app.classList.toggle('readonly', readOnly);
  renderTimeline();
  updateStatus();
}

function commit() {
  rec.dirty = true;
  saveRecord(rec);
  renderTimeline();
  updateStatus();
}

function updateStatus() {
  if (!rec || readOnly) return;
  statusEl.textContent = !rec.gistId ? 'Saved in this browser only' : rec.dirty ? 'Not saved to link yet' : 'All changes saved';
  saveArea.replaceChildren(...(rec.gistId ? [
    rec.dirty && h('span.unsaved', { title: 'Your changes are kept in this browser. Save to update the shared link.' }, 'Unsaved'),
    h('button', { type: 'button', onclick: openShareDialog }, 'Share'),
    h('button.primary', { type: 'button', disabled: saving || !rec.dirty, onclick: quickSave }, saving ? 'Saving…' : 'Save'),
  ] : [h('button.primary', { type: 'button', onclick: openShareDialog }, 'Save…')]).filter(Boolean));
}

async function quickSave() {
  const token = storage.get(TOKEN_KEY);
  if (!token) return openShareDialog();
  if (saving || !rec.dirty) return;
  const target = rec;
  saving = true;
  updateStatus();
  try {
    if (await saveToGitHub(target, token)) toast('Saved.');
  } catch (err) {
    toast(err.message, { label: 'Try again', run: quickSave });
  }
  saving = false;
  updateStatus();
}

/* ---------- Scale ---------- */

const ZOOM_MIN = 40, ZOOM_MAX = 1200, PAD = 24;
const PILL_ZOOM = 100; // from here on, travel and activities get a capsule next to the strip
const zoomToSlider = z => 100 * Math.log(z / ZOOM_MIN) / Math.log(ZOOM_MAX / ZOOM_MIN);
const sliderToZoom = v => ZOOM_MIN * Math.pow(ZOOM_MAX / ZOOM_MIN, v / 100);
const dayCount = () => Math.round((tripEnd(rec.trip) - tripStart(rec.trip)) / DAY);

function setZoom(next, anchorClientY) {
  const box = scroller.getBoundingClientRect();
  const offset = anchorClientY == null ? box.height / 2 : anchorClientY - box.top;
  const dayAtAnchor = (scroller.scrollTop + offset - PAD) / pxPerDay;
  pxPerDay = clamp(next, ZOOM_MIN, ZOOM_MAX);
  storage.set(ZOOM_KEY, String(Math.round(pxPerDay)));
  if (document.activeElement !== zoomInput) zoomInput.value = zoomToSlider(pxPerDay);
  renderTimeline();
  scroller.scrollTop = dayAtAnchor * pxPerDay + PAD - offset;
}

/* ---------- Timeline ---------- */

function kindFor(it) {
  if (it.type === 'travel') return MODES[it.mode]?.[1] || 'Travel';
  if (it.type === 'activity') return ACTIVITIES[it.kind]?.[1] || 'Activity';
  if (it.type === 'stay') return STAYS[it.kind]?.[1] || 'Stay';
  return ITEM_TYPES[it.type][1];
}
function titleFor(it) {
  if (it.type === 'travel') return `${it.from} → ${it.to}`;
  if (it.type === 'activity') return it.title || ACTIVITIES[it.kind]?.[1] || 'Activity';
  if (it.type === 'stay') return it.title || STAYS[it.kind]?.[1] || 'Stay';
  return `Trip ${it.type === 'start' ? 'starts' : 'ends'}${it.location ? `: ${it.location}` : ''}`;
}
function metaFor(it) {
  const a = toMs(it.at), b = it.until ? toMs(it.until) : null;
  if (it.type === 'travel') return [MODES[it.mode]?.[1], it.details, fmtRange(a, b), durationFor(it)].filter(Boolean).join(', ');
  if (it.type === 'activity') return [fmtRange(a, b), it.location].filter(Boolean).join(', ');
  return fmtRange(a, b);
}

// What items show on screen: the kind in plain text, then what the user typed in bold.
function headingNodes(it) {
  const b = text => h('b', {}, text);
  const typed = it.type === 'travel' ? [b(it.from), ' → ', b(it.to)]
    : it.type === 'start' || it.type === 'end' ? (it.location ? [b(it.location)] : [])
    : (it.title ? [b(it.title)] : []);
  if (!typed.length) return [h('span.item-kind.alone', {}, glyph(it), kindFor(it))];
  return [h('span.item-kind', {}, glyph(it), kindFor(it)), h('span.item-title', {}, typed)];
}
function metaNodes(it) {
  const a = toMs(it.at), b = it.until ? toMs(it.until) : null;
  const typed = text => text && h('b', {}, text);
  const parts = it.type === 'travel' ? [typed(it.details), fmtRange(a, b), durationFor(it)]
    : it.type === 'activity' ? [fmtRange(a, b), typed(it.location)]
    : [fmtRange(a, b)];
  return parts.filter(Boolean).flatMap((part, i) => (i ? [', ', part] : [part]));
}

// "Link · Map" on items that have a web link, an address, or both.
function itemLinks(it, linkLabel) {
  const anchor = (href, text) => h('a', { href, target: '_blank', rel: 'noopener noreferrer', onclick: e => e.stopPropagation() }, text);
  const url = safeUrl(it.url), q = mapQuery(it.address);
  return [url && anchor(url, linkLabel), q && anchor(mapsLink(q), 'Map')].filter(Boolean)
    .flatMap((part, i) => (i ? [' · ', part] : [part]));
}

// How many lines a text takes in a box of the given width, so boxes can be sized before they are drawn.
let measureContext;
function textLines(text, weight, size, maxWidth) {
  measureContext ||= document.createElement('canvas').getContext('2d');
  measureContext.font = `${weight} ${size}px ${getComputedStyle(document.body).fontFamily}`;
  const width = t => measureContext.measureText(t).width, room = Math.max(maxWidth, 20) * .97;
  let lines = 1, line = '';
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const next = line ? `${line} ${word}` : word;
    if (width(next) <= room) { line = next; continue; }
    if (line) lines++;
    lines += Math.max(0, Math.ceil(width(word) / room) - 1); // a very long word breaks anywhere
    line = width(word) > room ? '' : word;
  }
  return lines;
}
const titleText = it => it.type === 'travel' ? `${it.from} → ${it.to}` : it.type === 'start' || it.type === 'end' ? it.location || '' : it.title || '';
const nightsText = it => {
  const n = it.until ? Math.round((toMs(it.until.slice(0, 10)) - toMs(it.at.slice(0, 10))) / DAY) : 0;
  return n === 1 ? '1 night' : `${n} nights`;
};
function stayMinHeight(it, boxWidth) {
  const room = boxWidth - 19; // padding and borders
  const links = [safeUrl(it.url) && 'Link', mapQuery(it.address) && 'Map'].filter(Boolean).join(' · ');
  const small = textLines(`${nightsText(it)} ${links}`, 400, 12, room);
  const head = it.title ? 16.2 + textLines(it.title, 600, 13, room) * 17.6 : 17.6;
  return Math.ceil(15 + head + small * 16.2 + 2);
}

// Greedy interval packing: each entry takes the first lane it fits in.
function assignLanes(entries, gap) {
  const laneEnds = [];
  for (const e of entries.sort((x, y) => x.top - y.top)) {
    let lane = laneEnds.findIndex(end => end + gap <= e.top);
    if (lane < 0) lane = laneEnds.length;
    laneEnds[lane] = e.top + e.height;
    e.lane = lane;
  }
  return laneEnds.length;
}

function renderTimeline() {
  const trip = rec.trip, T0 = tripStart(trip), T1 = tripEnd(trip);
  const days = dayCount();
  const y = ms => PAD + (ms - T0) / DAY * pxPerDay;
  const dur = ms => ms / DAY * pxPerDay;
  const { segs, mismatches } = computeSegments(trip);
  assignPlaceHues(segs);
  const mobile = matchMedia('(max-width: 640px)').matches;
  const gutter = mobile ? 62 : 130, lineW = mobile ? 30 : 54;
  const compact = pxPerDay < 110;
  const height = PAD * 2 + days * pxPerDay;

  const track = h('.track', { style: { height: px(height) } });
  track.classList.toggle('tiny', pxPerDay < 90);

  // Day grid
  for (let i = 0; i < days; i++) {
    const ms = T0 + i * DAY;
    const places = [...new Set(segs.filter(s => s.kind === 'place' && s.a < ms + DAY && s.b > ms).map(s => s.name))];
    const day = h('.day', { className: `day${i % 2 ? ' alt' : ''}${new Date(ms).getUTCDay() === 1 ? ' week' : ''}`, style: { top: px(y(ms)), height: px(pxPerDay) } },
      h('.day-label', {},
        h('strong', {}, h('b', {}, new Date(ms).getUTCDate()), ` ${fmtDatePart(ms, ['weekday', 'short'])}`,
          // The month only shows where it starts, so every date stays unambiguous.
          (i === 0 || new Date(ms).getUTCDate() === 1) && ` ${fmtDatePart(ms, ['month', 'short'])}`),
        h('span', {}, `Day ${i + 1}`), !mobile && places.length > 0 && h('span', {}, ` in ${places.slice(0, 2).join(', ')}`)));
    const step = pxPerDay >= 900 ? 3 : pxPerDay >= 320 ? 6 : 0;
    for (let hr = step; step && hr < 24; hr += step) {
      day.append(h('.hour', { style: { top: px(hr / 24 * pxPerDay) } }, h('span', {}, fmtTime(ms + hr * HOUR))));
    }
    track.append(day);
  }

  // The fat line, colored by where you are
  const line = h('.line', { style: { top: px(PAD), height: px(days * pxPerDay) } });
  for (const s of segs) {
    const el = h('.seg', { style: { top: px(y(s.a) - PAD), height: px(dur(s.b - s.a)) } });
    if (s.kind === 'empty') el.classList.add('empty');
    if (s.kind === 'place') {
      el.style.background = placeColor(s.name);
      // roughly 8px per letter, plus margins
      if (dur(s.b - s.a) > s.name.length * 8 + 40) el.append(h('span.seg-label', {}, s.name));
    }
    if (s.kind === 'transit') el.style.background = `linear-gradient(${placeColor(s.from)}, ${placeColor(s.to)})`;
    line.append(el);
  }
  track.append(line);
  const lineCenter = gutter + lineW / 2;
  for (const s of segs) {
    if (s.kind !== 'transit') continue;
    track.append(h(`.marker.status-${statusOf(s.item)}`, { style: { left: px(lineCenter), top: px(y((s.a + s.b) / 2)) } }, glyph(s.item)));
  }
  for (const it of trip.items) {
    if (it.type !== 'start' && it.type !== 'end') continue;
    track.append(h(`.marker.status-${statusOf(it)}`, { style: { left: px(lineCenter), top: px(y(toMs(it.at))) } }, glyph(it)));
  }

  // Zoomed in far enough, travel and activities also show as capsules right next to the line
  const pillW = mobile ? 8 : 10, pillX = gutter + lineW + 6;
  const pills = pxPerDay < PILL_ZOOM ? [] : trip.items.filter(i => i.type === 'travel' || i.type === 'activity').map(it => {
    const a = toMs(it.at), b = Math.max(toMs(it.until || it.at), a);
    return { it, a, top: y(a), height: Math.max(dur(b - a), pillW) };
  });
  const pillLanes = assignLanes(pills, 3);
  const pillOf = new Map(pills.map(pl => [pl.it.id, pl]));

  // Stays sit in a column next to the capsules
  const stayW = mobile ? 30 : 136;
  const stays = trip.items.filter(i => i.type === 'stay').map(it => {
    const a = toMs(it.at), b = Math.max(toMs(it.until || it.at), a);
    return { it, top: y(a), height: Math.max(dur(b - a), mobile ? (it.title ? 52 : 34) : stayMinHeight(it, stayW)), a };
  });
  const stayLanes = assignLanes(stays, 2);
  const stayX = pillLanes ? pillX + pillLanes * (pillW + 4) + 6 : gutter + lineW + 8;
  for (const s of stays) {
    const place = placeAt(segs, s.a).name;
    const color = place ? placeColor(place) : '#aeaeb2';
    const links = itemLinks(s.it, 'Link');
    track.append(itemNode('.stay', s.it, {
      left: px(stayX + s.lane * (stayW + 4)), top: px(s.top), width: px(stayW), height: px(s.height),
      'border-color': color, background: `color-mix(in oklch, ${color} 28%, white)`,
    }, h('span.stay-inner', {},
      h('span.stay-icon', {}, glyph(s.it)),
      headingNodes(s.it),
      !mobile && h('small', {}, nightsText(s.it)),
      links.length > 0 && !mobile && h('small', {}, ' ', links))));
  }

  // Everything else gets a card, connected to the line by a tick
  const cardX = stayX + (stayLanes ? stayLanes * (stayW + 4) : 0) + 16;
  const avail = scroller.clientWidth - cardX - 14;
  const cards = trip.items.filter(i => i.type !== 'stay').map(it => {
    const a = toMs(it.at), b = Math.max(toMs(it.until || it.at), a);
    return { it, a, b, shift: pillOf.has(it.id) ? pillW / 2 : 0 }; // the connector meets a capsule at its center
  });
  // Titles wrap, so a box's height depends on its width, which depends on how many columns the heights need.
  let laneW = 340, cardLanes = 1;
  for (let pass = 0; pass < 5; pass++) {
    for (const c of cards) {
      const title = titleText(c.it);
      const titleLines = !title ? 0 : compact ? 1 : textLines(title, 600, 13, laneW - 24);
      const lines = 2 + titleLines + (mismatches[c.it.id] ? 1 : 0) + (safeUrl(c.it.url) || mapQuery(c.it.address) ? 1 : 0);
      c.y = y(c.a) + c.shift;
      c.top = Math.max(c.y - 15, 0);
      c.height = Math.max(dur(c.b - c.a) + 15 - c.shift, compact ? 30 : 20 + lines * 17);
    }
    cardLanes = Math.max(assignLanes(cards, 5), 1);
    const next = clamp(avail / cardLanes - 6, Math.min(170, avail), 340);
    if (Math.abs(next - laneW) < .5) break;
    laneW = next;
  }
  track.style.width = px(Math.max(scroller.clientWidth, cardX + cardLanes * (laneW + 6) + 14));

  for (const c of cards) {
    const x = cardX + c.lane * (laneW + 6);
    const place = placeAt(segs, c.a);
    const color = place.name ? placeColor(place.name) : '#aeaeb2';
    const flag = c.it.type === 'start' || c.it.type === 'end';
    const warn = mismatches[c.it.id];
    const links = itemLinks(c.it, 'Open link');
    const pill = pillOf.get(c.it.id);
    const from = pill ? pillX + pill.lane * (pillW + 4) + pillW : gutter + lineW;
    track.append(h(`.tick.status-${statusOf(c.it)}${pill ? '.link' : ''}`, { style: { left: px(from), top: px(c.y - 1), width: px(x - from), background: pill ? itemColor(c.it) : color } }));
    track.append(itemNode(flag ? '.card.flag' : '.card', c.it, { left: px(x), top: px(c.top), width: px(laneW), height: px(c.height) },
      h('span.text', {},
        headingNodes(c.it),
        h('span.meta', {}, metaNodes(c.it)),
        warn && h('span.meta.warn', {}, `You're in ${warn} before this`),
        links.length > 0 && h('span.meta', {}, links))));
    if (compact) track.lastChild.classList.add('compact');
  }

  const tint = c => `color-mix(in oklch, ${c} 25%, white)`;
  for (const pl of pills) {
    const it = pl.it, color = itemColor(it);
    track.append(h(`.pill.status-${statusOf(it)}`, {
      title: `${titleFor(it)}, ${metaFor(it)}`, 'aria-hidden': 'true',
      onclick() { if (readOnly) openDetails(it); else openItemDialog(it); },
      style: {
        left: px(pillX + pl.lane * (pillW + 4)), top: px(pl.top), width: px(pillW), height: px(pl.height),
        '--pill-bg': color, '--pill-tint': tint(color), '--pill-edge': `color-mix(in oklch, ${color} 60%, black)`,
      },
    }));
  }

  if (trip.items.every(i => i.type === 'start') && !readOnly) {
    track.append(h('.empty-hint', { style: { left: px(gutter + lineW + 24), top: px(PAD + 56) } },
      'Point at the colored strip and click to add travel, stays and activities.'));
  }

  if (!readOnly) attachAddCursor(track, line, segs);
  scroller.replaceChildren(track);
}

function itemNode(spec, item, style, ...kids) {
  const open = () => (readOnly ? openDetails(item) : openItemDialog(item));
  return h(`${spec}.status-${statusOf(item)}`, {
    style, tabIndex: 0, role: 'button', 'data-id': item.id, 'aria-label': `${titleFor(item).replace(' → ', ' to ')}, ${metaFor(item)}, ${STATUSES[statusOf(item)][1]}`,
    onclick: open,
    onkeydown(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } },
  }, ...kids);
}

function attachAddCursor(track, line, segs) {
  const T0 = tripStart(rec.trip), T1 = tripEnd(rec.trip);
  const chip = h('span');
  const guide = h('.guide', { hidden: true }, h('i', {}, '+'), chip);
  track.append(guide);
  const timeAt = clientY => {
    const snap = pxPerDay >= 600 ? 15 * MIN : pxPerDay >= 150 ? 30 * MIN : HOUR;
    const raw = T0 + (clientY - track.getBoundingClientRect().top - PAD) / pxPerDay * DAY;
    return clamp(Math.round(raw / snap) * snap, T0, T1 - snap);
  };
  line.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') return;
    const t = timeAt(e.clientY), place = placeAt(segs, t);
    guide.hidden = false;
    guide.style.top = px(PAD + (t - T0) / DAY * pxPerDay);
    const where = place.outside ? 'outside the trip' : place.transit ? `on the way to ${place.name}` : place.name ? `in ${place.name}` : '';
    chip.textContent = `${fmtDay(t)}, ${fmtTime(t)}${where ? `, ${where}` : ''}`;
  });
  line.addEventListener('pointerleave', () => { guide.hidden = true; });
  line.addEventListener('click', e => openAddMenu(timeAt(e.clientY), e.clientX, e.clientY));
}

/* ---------- Adding and editing items ---------- */

function openAddMenu(t, x, y) {
  document.querySelector('.menu')?.remove();
  const has = type => rec.trip.items.some(i => i.type === type);
  const close = () => { menu.remove(); document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', onKey); };
  const outside = e => { if (!menu.contains(e.target)) close(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const menu = h('.menu', { role: 'menu' },
    h('p', {}, `${fmtDay(t)}, ${fmtTime(t)}`),
    Object.entries(ITEM_TYPES).map(([type, [icon, label]]) => {
      const taken = (type === 'start' || type === 'end') && has(type);
      return h('button', {
        type: 'button', role: 'menuitem', disabled: taken,
        onclick() { close(); openItemDialog(newItem(type, t)); },
      }, `${icon}  ${label}${taken ? ' (already added)' : ''}`);
    }));
  document.body.append(menu);
  menu.style.left = px(clamp(x, 8, innerWidth - menu.offsetWidth - 8));
  menu.style.top = px(clamp(y, 8, innerHeight - menu.offsetHeight - 8));
  document.addEventListener('pointerdown', outside, true);
  document.addEventListener('keydown', onKey);
  menu.querySelector('button:not(:disabled)')?.focus({ preventScroll: true });
}

function newItem(type, t) {
  const trip = rec.trip, last = tripEnd(trip) - MIN;
  const here = placeAt(computeSegments(trip).segs, t).name;
  const base = { id: uid(), type, status: 'planned', at: fromMs(t), isNew: true };
  if (type === 'travel') return { ...base, mode: 'flight', from: here, to: '', until: fromMs(Math.min(t + 2 * HOUR, last)) };
  if (type === 'activity') return { ...base, kind: 'sightseeing', until: fromMs(Math.min(t + 2 * HOUR, last)) };
  if (type === 'stay') {
    // Default check-out: the next departure, or else the next morning.
    const next = trip.items.filter(i => i.type === 'travel' && toMs(i.at) > t).map(i => toMs(i.at)).sort((a, b) => a - b)[0];
    const morning = Math.floor(t / DAY) * DAY + DAY + 10 * HOUR;
    return { ...base, kind: 'hotel', until: fromMs(Math.min(next || morning, last)) };
  }
  return { ...base, location: here };
}

function choiceGroup(name, options, selected, legend) {
  return h('fieldset.choices', { 'aria-label': legend },
    Object.entries(options).map(([value, [icon, label]]) => h('label', {},
      h('input', { type: 'radio', name, value, checked: value === selected }),
      h('span', {}, `${icon} ${label}`))));
}

function openItemDialog(item) {
  const trip = rec.trip, isNew = !!item.isNew;
  const knownPlaces = [...new Set(trip.items.flatMap(i => [i.from, i.to, i.location]).filter(Boolean))];
  const placesList = h('datalist', { id: 'known-places' }, knownPlaces.map(p => h('option', { value: p })));
  const zoneOf = {};
  for (const i of trip.items) {
    if (i.from && i.fromTz) zoneOf[placeKey(i.from)] = i.fromTz;
    if (i.to && i.toTz) zoneOf[placeKey(i.to)] = i.toTz;
  }
  const zonesList = h('datalist', { id: 'known-zones' }, ZONES.map(z => h('option', { value: z })));
  // Filling in a place fills its time zone too, unless the zone was typed by hand.
  const fillZone = (zoneName, place) => {
    const input = form.elements[zoneName], known = zoneOf[placeKey(place)] || '';
    if (!input.value || input.value === input.dataset.auto) { input.value = known; input.dataset.auto = known; }
  };
  const placeField = (name, label, zoneName) =>
    text(name, label, item[name], { ...placeOpts, onchange(e) { fillZone(zoneName, e.target.value); } });
  const zoneField = (name, label, place) =>
    text(name, label, item[name] || zoneOf[placeKey(place)] || '', { list: 'known-zones', autocomplete: 'off', placeholder: 'Optional, like Europe/Paris', 'data-auto': zoneOf[placeKey(place)] || '' });
  const text = (name, label, value, opts = {}) =>
    h('label.field', {}, label, h('input', { name, value: value || '', ...opts }));
  const when = (name, label, value) => text(name, label, value, { type: 'datetime-local', required: true });
  const placeOpts = { required: true, autocomplete: 'off', list: 'known-places' };
  const notes = h('label.field', {}, 'Notes', h('textarea', { name: 'notes', rows: 2, value: item.notes || '' }));
  const addressField = () => {
    const input = h('textarea', { name: 'address', rows: 2, maxlength: 300, autocomplete: 'off', placeholder: 'Street, postal code, city, country', value: item.address || '' });
    const map = mapControls(() => input.value);
    let timer;
    input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(map.update, 500); });
    return [h('label.field', {}, 'Address', input), map.el];
  };
  const fields = {
    travel: () => [
      choiceGroup('mode', MODES, item.mode, 'How you travel'),
      h('.row', {}, placeField('from', 'From', 'fromTz'), placeField('to', 'To', 'toTz')),
      h('.row', {}, when('at', 'Departs', item.at), when('until', 'Arrives', item.until)),
      h('.row', {}, zoneField('fromTz', 'Departure time zone', item.from), zoneField('toTz', 'Arrival time zone', item.to)),
      h('p.hint', {}, 'Use local times at each end. With both time zones, the card also shows the real travel time.'),
      text('details', 'Details', item.details, { placeholder: 'Flight number, seat, operator' }),
      text('url', 'Link', item.url, { placeholder: 'Optional' }),
    ],
    activity: () => [
      choiceGroup('kind', ACTIVITIES, item.kind, 'Kind of activity'),
      text('title', 'Name', item.title, { placeholder: 'Optional' }),
      h('.row', {}, when('at', 'Starts', item.at), when('until', 'Ends', item.until)),
      text('location', 'Where', item.location, { placeholder: 'Optional', autocomplete: 'off' }),
      ...addressField(),
      text('url', 'Link', item.url, { placeholder: 'Optional' }),
    ],
    stay: () => [
      choiceGroup('kind', STAYS, item.kind, 'Kind of stay'),
      text('title', 'Name', item.title, { placeholder: 'Optional' }),
      h('.row', {}, when('at', 'Check-in', item.at), when('until', 'Check-out', item.until)),
      ...addressField(),
      text('url', 'Link', item.url, { placeholder: 'Optional' }),
    ],
    start: () => [text('location', 'Where does the trip start?', item.location, placeOpts), when('at', 'When', item.at)],
    end: () => [text('location', 'Where does the trip end?', item.location, placeOpts), when('at', 'When', item.at)],
  };
  const error = h('p.error', { hidden: true });
  const fail = message => { error.textContent = message; error.hidden = false; };

  const form = h('form', {
    onsubmit(e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      for (const k of Object.keys(data)) data[k] = data[k].trim();
      const a = toMs(data.at), b = data.until ? toMs(data.until) : null;
      for (const z of ['fromTz', 'toTz']) {
        if (data[z] && !isZone(data[z])) return fail(`"${data[z]}" isn't a time zone name. Pick one from the list, like Europe/Paris.`);
      }
      if (item.type === 'travel' && data.fromTz && data.toTz && b != null) {
        if (wallToUtc(data.until, data.toTz) <= wallToUtc(data.at, data.fromTz)) return fail('Counting the time zones, the arrival is before the departure. Check the times and time zones.');
      } else if (b != null && b < a && !(item.type === 'travel' && a - b <= DAY)) {
        return fail('The end has to be after the beginning.');
      }
      // Items that spill over the trip dates stretch the trip, within reason.
      const lo = Math.min(tripStart(trip), Math.floor(Math.min(a, b ?? a) / DAY) * DAY);
      const hi = Math.max(tripEnd(trip), (Math.floor(Math.max(a, b ?? a) / DAY) + 1) * DAY);
      if (tripStart(trip) - lo > 7 * DAY || hi - tripEnd(trip) > 7 * DAY) return fail('That is more than a week outside the trip dates. Check the date, or use Change dates if the trip really is that long.');
      if (data.url) {
        const url = safeUrl(data.url);
        if (!url) return fail('Enter the link as a web address, like https://example.com.');
        data.url = url;
      }
      const stretched = lo < tripStart(trip) || hi > tripEnd(trip);
      if (stretched) { trip.startDate = fromMs(lo).slice(0, 10); trip.endDate = fromMs(hi - DAY).slice(0, 10); }
      const updated = { id: item.id, type: item.type, ...data };
      const i = trip.items.findIndex(x => x.id === item.id);
      if (i >= 0) trip.items[i] = updated; else trip.items.push(updated);
      dlg.close();
      commit();
      refocus(item.id);
      if (stretched) toast(`The trip now runs ${fmtDay(tripStart(trip))} to ${fmtDay(tripEnd(trip) - DAY)}.`);
    },
  },
    h('h2', {}, `${isNew ? 'Add' : 'Edit'} ${ITEM_TYPES[item.type][1].toLowerCase()}`),
    placesList, zonesList,
    fields[item.type](),
    h('p.choices-label', {}, 'Status'),
    choiceGroup('status', STATUSES, statusOf(item), 'Status'),
    notes,
    error,
    h('.actions', {},
      !isNew && h('button.danger.left', {
        type: 'button',
        onclick() {
          const at = trip.items.findIndex(x => x.id === item.id);
          const [removed] = trip.items.splice(at, 1);
          dlg.close();
          commit();
          toast(`Deleted ${titleFor(removed)}`, { label: 'Undo', run() { trip.items.splice(at, 0, removed); commit(); } });
        },
      }, 'Delete'),
      h('button', { type: 'button', onclick() { dlg.close(); } }, 'Cancel'),
      h('button.primary', { type: 'submit' }, isNew ? 'Add to trip' : 'Save changes')));
  const dlg = openDialog(form);
}

function refocus(id) {
  scroller.querySelector(`[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
}

function openDetails(item) {
  const link = safeUrl(item.url);
  const map = mapQuery(item.address) && mapControls(() => item.address);
  const dlg = openDialog(h('div', {},
    h('h2', {}, headingNodes(item)),
    h('p.meta', {}, metaNodes(item)),
    h('p', {}, STATUSES[statusOf(item)].join(' ')),
    map && h('p.notes', {}, item.address),
    map && map.el,
    item.notes && h('p.notes', {}, item.notes),
    link && h('p', {}, h('a', { href: link, target: '_blank', rel: 'noopener noreferrer' }, link)),
    h('.actions', {}, h('button', { type: 'button', onclick() { dlg.close(); } }, 'Close'))));
}

function openDatesDialog() {
  const trip = rec.trip;
  const first = h('input', { type: 'date', required: true, value: trip.startDate });
  const last = h('input', { type: 'date', required: true, value: trip.endDate });
  const error = h('p.error', { hidden: true });
  const fail = m => { error.textContent = m; error.hidden = false; };
  const dlg = openDialog(h('form', {
    onsubmit(e) {
      e.preventDefault();
      if (last.value < first.value) return fail('The last day has to be on or after the first day.');
      const lo = toMs(first.value), hi = toMs(last.value) + DAY;
      const outside = trip.items.filter(i => toMs(i.at) < lo || toMs(i.until || i.at) >= hi);
      if (outside.length) return fail(`${outside.length} ${outside.length === 1 ? 'item falls' : 'items fall'} outside these dates. Move or delete them first.`);
      trip.startDate = first.value;
      trip.endDate = last.value;
      dlg.close();
      commit();
    },
  },
    h('h2', {}, 'Change dates'),
    h('.row', {}, h('label.field', {}, 'First day', first), h('label.field', {}, 'Last day', last)),
    error,
    h('.actions', {},
      h('button', { type: 'button', onclick() { dlg.close(); } }, 'Cancel'),
      h('button.primary', { type: 'submit' }, 'Save dates'))));
}

/* ---------- Saving and sharing ---------- */

function downloadTrip() {
  const name = rec.trip.title.replace(/[^\p{L}\p{N}]+/gu, '-').toLowerCase() || 'trip';
  const url = URL.createObjectURL(new Blob([JSON.stringify(rec.trip, null, 2)], { type: 'application/json' }));
  h('a', { href: url, download: name + '.json' }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openShareDialog() {
  const body = h('div');
  const dlg = openDialog(body);
  const draw = (message, isError) => {
    const token = storage.get(TOKEN_KEY);
    const tokenInput = h('input', { type: 'password', autocomplete: 'off', placeholder: 'ghp_…' });
    const saveBtn = h('button.primary', {
      type: 'button',
      async onclick() {
        const tok = token || tokenInput.value.trim();
        if (!tok) return draw('Paste a GitHub token first.', true);
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          const saved = await saveToGitHub(rec, tok);
          storage.set(TOKEN_KEY, tok);
          updateStatus();
          draw(saved ? 'Saved.' : 'Not saved. Nothing changed on GitHub.', !saved);
        } catch (err) { draw(err.message, true); }
      },
    }, rec.gistId ? 'Save' : 'Save and create link');
    const showSave = !rec.gistId || !token || rec.dirty;
    const link = rec.gistId && h('input', { readOnly: true, value: shareLink(rec), 'aria-label': 'Share link', onfocus(e) { e.target.select(); } });

    body.replaceChildren(h('div', {},
      h('h2', {}, rec.gistId ? 'Share' : 'Save and share'),
      h('p.hint', {}, 'Changes are kept in this browser automatically. People with the link see them after you save.'),
      h('h3', {}, 'Share a view-only link'),
      h('p.hint', {}, 'Your trip is encrypted before it goes to GitHub. Anyone with the link can read it, and a link can’t be taken back once it’s been sent.'),
      location.protocol === 'file:' && h('p.hint', {}, 'This page is running from a file on your computer. Host it online, for example on GitHub Pages, so that links work for other people.'),
      link && h('.row', {}, h('div', { style: { flex: '1 1 200px' } }, link), h('button', {
        type: 'button',
        async onclick() {
          try { await navigator.clipboard.writeText(link.value); toast('Link copied.'); }
          catch { link.focus(); toast('Press Cmd+C or Ctrl+C to copy the selected link.'); }
        },
      }, 'Copy link')),
      !token && h('label.field', {}, 'GitHub token', tokenInput),
      !token && h('p.hint', {}, h('a', { href: 'https://github.com/settings/tokens/new?scopes=gist&description=paodequeijo', target: '_blank', rel: 'noopener noreferrer' }, 'Create a token'),
        ' with only the gist permission. It stays in this browser and is never part of the link.'),
      message && h(isError ? 'p.error' : 'p', {}, message),
      h('.row', {}, showSave && saveBtn,
        token && h('button.plain', { type: 'button', onclick() { storage.remove(TOKEN_KEY); draw('Token removed from this browser.'); } }, 'Forget my token')),
      h('h3', {}, 'Keep a copy as a file'),
      h('p.hint', {}, 'Trip files aren’t encrypted, so keep them somewhere private.'),
      h('.row', {},
        h('button', { type: 'button', onclick: downloadTrip }, 'Download trip file'),
        h('button', { type: 'button', onclick() { dlg.close(); pickTripFile(); } }, 'Open a trip file')),
      h('.actions', {}, h('button', { type: 'button', onclick() { dlg.close(); } }, 'Done'))));
  };
  draw();
}

/* ---------- Start ---------- */

window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (rec && scroller?.isConnected) renderTimeline(); });
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's' && rec && !readOnly) {
    e.preventDefault();
    if (document.querySelector('dialog[open]')) return;
    if (rec.gistId) quickSave(); else openShareDialog();
  }
});
route();
</script>
